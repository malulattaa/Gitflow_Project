<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atividade GITFLOW</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Entre em Contato Conosco</h1>
            <p>Preencha o formulário abaixo e retornaremos o mais breve possível.</p>
        </header>
        <main>
            <form id="contactForm">
                <div class="form-group">
                    <label for="nome">Nome Completo:</label>
                    <input type="text" id="nome" name="nome" required>
                </div>
                <div class="form-group">
                    <label for="email">E-mail:</label>
                    <input type="email" id="email" name="email" required>
                </div>
                <div class="form-group">
                    <label for="assunto">Assunto:</label>
                    <select id="assunto" name="assunto" required>
                        <option value="" disabled selected>Selecione um assunto</option>
                        <option value="suporte">Suporte Técnico</option>
                        <option value="comercial">Informações Comerciais</option>
                        <option value="outros">Outros</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="mensagem">Mensagem:</label>
                    <textarea id="mensagem" name="mensagem" rows="5" required></textarea>
                </div>
                <button type="submit" id="submitBtn">Enviar Mensagem</button>
                <p id="feedbackMessage" class="feedback-message"></p>
            </form>
        </main>
        <footer>
            <p>Formulário Interativo</p>
        </footer>
    </div>
</body>
</html>
